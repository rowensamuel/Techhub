<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechHub - Your Ultimate Gadget Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      background-color: #000000; /* True Black */
      color: #ffffff;
    }
    
    /* Netflix Row Scrollbar Hiding */
    .netflix-row::-webkit-scrollbar {
      display: none;
    }
    .netflix-row {
      -ms-overflow-style: none;
      scrollbar-width: none;
      scroll-behavior: smooth;
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding: 1.5rem 0; /* Vertical padding to prevent hover clipping */
    }

    /* Custom scrollbar for vertical page */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #A10E14; /* TechHub Dark Red */
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #7F0B10;
    }

    /* Netflix Card Hover Animation - Fixed Clipping */
    .netflix-card {
      position: relative;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      flex-shrink: 0;
      cursor: pointer;
    }
    .netflix-card:hover {
      transform: scale(1.1);
      z-index: 50;
      box-shadow: 0 15px 30px rgba(0,0,0,0.8), 0 0 10px rgba(161, 14, 20, 0.3);
    }

    /* Cinematic Hero Intro */
    @keyframes netflixIn {
      0% { transform: scale(1.05); opacity: 0; filter: blur(8px); }
      100% { transform: scale(1); opacity: 1; filter: blur(0); }
    }
    .animate-cinematic {
      animation: netflixIn 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    /* Ta-dum Splash Screen Animation */
    @keyframes tadum {
      0% { transform: scale(0.7); opacity: 0; letter-spacing: 0.5em; filter: blur(10px); }
      40% { transform: scale(1.05); opacity: 1; letter-spacing: 0em; filter: blur(0); }
      100% { transform: scale(1); opacity: 1; letter-spacing: 0em; filter: blur(0); }
    }
    .animate-tadum {
      animation: tadum 1.2s cubic-bezier(0.21, 0.6, 0.35, 1) forwards;
    }

    .shimmer-red {
      background: linear-gradient(90deg, rgba(161, 14, 20, 0) 0%, rgba(161, 14, 20, 0.1) 50%, rgba(161, 14, 20, 0) 100%);
      background-size: 200% 100%;
      animation: shimmer 3s infinite linear;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
  </style>
